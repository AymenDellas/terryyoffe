<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 860" fill="none" preserveAspectRatio="none">
  <defs>
    <linearGradient id="spill" x1="0" y1="12" x2="0" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff0d9" stop-opacity=".19"/>
      <stop offset=".24" stop-color="#f9dfbb" stop-opacity=".105"/>
      <stop offset=".65" stop-color="#ebc49b" stop-opacity=".035"/>
      <stop offset="1" stop-color="#ebc49b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shaft" x1="0" y1="12" x2="0" y2="730" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff7e8" stop-opacity=".24"/>
      <stop offset=".16" stop-color="#ffead0" stop-opacity=".14"/>
      <stop offset=".55" stop-color="#f0d1ad" stop-opacity=".045"/>
      <stop offset="1" stop-color="#f0d1ad" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="led" x1="310" y1="0" x2="382" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eab780" stop-opacity="0"/>
      <stop offset=".25" stop-color="#ffe4bf" stop-opacity=".75"/>
      <stop offset=".5" stop-color="#fff8e7"/>
      <stop offset=".75" stop-color="#ffe4bf" stop-opacity=".75"/>
      <stop offset="1" stop-color="#eab780" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-20%" width="200%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="core" x="-50%" y="-20%" width="200%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="bloom" x="-100%" y="-200%" width="300%" height="500%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <g id="fixture">
      <rect x="307" y="5" width="78" height="7" rx="3.5" fill="#111110"/>
      <path d="M313 6h66" stroke="#555047" stroke-opacity=".7"/>
      <rect x="310" y="10" width="72" height="3" rx="1.5" fill="url(#led)"/>
      <path d="M318 13h56" stroke="#ffe7c7" stroke-width="4" stroke-opacity=".6" filter="url(#bloom)"/>
    </g>
  </defs>
  <!-- Wide falloff and a narrower shaft originate from each recessed LED. -->
  <g filter="url(#soft)">
    <path d="M325 12h42l286 788H44Z" fill="url(#spill)"/>
    <path d="M1045 12h42l326 788H764Z" fill="url(#spill)"/>
  </g>
  <g filter="url(#core)">
    <path d="M336 12h20l153 718H205Z" fill="url(#shaft)"/>
    <path d="M1056 12h20l176 718H925Z" fill="url(#shaft)"/>
  </g>
  <use href="#fixture"/>
  <use href="#fixture" transform="translate(720)"/>
</svg>
